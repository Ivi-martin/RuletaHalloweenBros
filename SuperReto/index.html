<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎃 Super Reto de Halloween 👻</title>
<style>
:root{--bg:#eef6ff;--fg:#1b2540;--card:#fff;--ac:#ff7a00;--bd:#c9d6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162b;--fg:#eaf0ff;--card:#1c2547;--bd:#34406b}}
:root[data-theme="dark"]{--bg:#10162b;--fg:#eaf0ff;--card:#1c2547;--bd:#34406b}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px;width:100%;max-width:560px;box-sizing:border-box}
h1,h2{margin:0 0 10px;text-align:center}
label{display:block;margin:8px 0;font-weight:bold}
select,input,textarea{width:100%;box-sizing:border-box;font-size:16px;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--fg);margin-top:3px}
button{font-size:17px;font-weight:bold;padding:12px;margin:5px 0;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer;width:100%}
button.sec{background:#5b6bd6}button.mini{width:auto;padding:8px 12px;font-size:14px;margin:3px}
.row{display:flex;gap:8px}.row>*{flex:1}
#game{width:min(100%,calc((100vh - 200px) * 1.6));max-width:1500px;text-align:center}
canvas{width:100%;border-radius:14px;border:3px solid var(--ac);touch-action:none;background:#000}
#pad{display:flex;gap:12px;margin-top:8px}#pad button{flex:1;margin:0;padding:14px 0;font-size:34px;line-height:1;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#pad button:active,#pad button.on{filter:brightness(.8);transform:scale(.97)}
#hint{font-size:14px;padding:6px}#bExit{width:auto;padding:8px 16px;font-size:14px;background:#888}
#msg{font-size:14px;min-height:18px;margin:6px 0}.qi{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--bd);padding:4px 0;font-size:14px}.del{background:#c0392b}details{margin:12px 0}
#tabs{margin:8px 0}#tabs b{display:block;margin-bottom:6px}.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.chip{width:auto;margin:0;padding:10px 0;font-size:18px;background:var(--bg);color:var(--fg);border:2px solid var(--bd)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tq{display:flex;gap:8px}.tq button{margin-top:8px}summary{cursor:pointer;font-weight:bold}
</style>
<style id="halloween-superreto">
:root {
  --bg: #0e051c !important;
  --fg: #f3e5f5 !important;
  --card: #1c0a34 !important;
  --ac: #ff7518 !important;
  --bd: #8e24aa !important;
}
body {
  background: radial-gradient(circle at 50% 10%, #30104e 0%, #170729 60%, #090212 100%) !important;
  color: #fff !important;
}
.card {
  background: #1c0a34 !important;
  border: 3px solid #ff7518 !important;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255,117,24,0.3) !important;
}
select, input, textarea {
  background: #120524 !important;
  color: #fff !important;
  border-color: #8e24aa !important;
}
button {
  background: linear-gradient(180deg, #ff7518, #e65100) !important;
  font-family: system-ui, sans-serif !important;
  font-weight: 900 !important;
  box-shadow: 0 4px 12px rgba(255,117,24,0.4) !important;
}
button.sec {
  background: #7b1fa2 !important;
}
</style>

</head><body>
<div id="menu" class="card">
<h1 style='color:#ff7518;font-family:"Luckiest Guy",sans-serif;letter-spacing:1px;'>🎃 Super Reto de Halloween 👻</h1>
<p style="text-align:center;margin:0 0 10px;color:#d1c4e9;">¡Responde las preguntas de Halloween para ganar puntos en la Ruleta! 🍬</p>
<label>Asignatura <select id="sSub"></select></label>
<label>Tema <select id="sTop"></select></label>
<div id="tabs" hidden><b>✖️ Elige las tablas que quieres practicar</b><div class="tg" id="tg"></div>
<div class="tq"><button class="mini sec" id="tAll" style="flex:1">✅ Todas</button><button class="mini sec" id="tNone" style="flex:1">⬜ Ninguna</button></div></div>
<label>Nivel <select id="sLvl"><option value="1">Nivel 1 · 100 puntos</option><option value="2">Nivel 2 · 200 puntos (más rápido)</option><option value="3">Nivel 3 · 300 puntos (muy rápido)</option></select></label>
<button data-m="1">▶ ¡JUGAR! Lluvia de respuestas</button>
<button class="sec" id="bEd">⚙️ Editor de temarios</button>
</div>
<div id="game" hidden><canvas id="cv" width="1280" height="800"></canvas><div id="pad"><button id="bL" aria-label="Izquierda">◀</button><button id="bR" aria-label="Derecha">▶</button></div><div id="hint"></div><button id="bExit">✖ Salir</button></div>
<div id="over" class="card" hidden><h2 id="oT"></h2><p id="oS" style="text-align:center;font-size:18px;line-height:1.6"></p>
<button id="bAgain">🔄 Jugar otra vez</button><button class="sec" id="bMenu">🏠 Menú</button></div>
<div id="ed" class="card" hidden><h2>✏️ Añadir preguntas</h2>
<label>Asignatura <select id="eSub"></select></label><input id="nSub" placeholder="Escribe el nombre de la nueva asignatura" hidden>
<label>Tema <select id="eTop"></select></label><input id="nTop" placeholder="Escribe el nombre del nuevo tema" hidden>
<label>Pregunta <input id="aP" placeholder="Ej: ¿Cuánto es 3+3?"></label>
<label>✅ Respuesta correcta <input id="aC"></label>
<label>❌ Respuesta mala 1 <input class="aI"></label>
<label>❌ Respuesta mala 2 <input class="aI"></label>
<label>❌ Respuesta mala 3 <input class="aI"></label>
<button id="bAdd">➕ Añadir pregunta</button><div id="msg"></div>
<b id="lstT">Preguntas de este tema</b><div id="lst"></div>
<details><summary>Copia de seguridad (opcional)</summary>
<textarea id="json" rows="5"></textarea>
<button class="mini sec" id="bExp">⬆ Exportar</button><button class="mini sec" id="bImp">⬇ Importar</button>
<label>Importar desde archivo <input type="file" id="file" accept=".json,application/json"></label></details>
<button id="bBack">← Volver</button></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
/* ===== DATOS (módulo de contenidos, ampliable desde el editor) ===== */
const DEF={subjects:[{name:"Halloween",topics:[{name:"Preguntas de Halloween",questions:[
 {"prompt":"¿Qué se dice al llamar a las puertas en Halloween?","correct":["Truco o trato"],"incorrect":["Hola amigos","Dame comida","Feliz Navidad"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Qué hortaliza naranja se vacía para ponerle una vela dentro?","correct":["Calabaza"],"incorrect":["Zanahoria","Naranja","Melón"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿En qué fecha de octubre se celebra la noche de Halloween?","correct":["31 de octubre"],"incorrect":["25 de diciembre","1 de noviembre","12 de octubre"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Qué significa la palabra inglesa 'Trick'?","correct":["Travesura"],"incorrect":["Caramelo","Disfraz","Monstruo"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Qué significa la palabra inglesa 'Treat'?","correct":["Golosina o regalo"],"incorrect":["Susto","Bruja","Escoba"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Qué personaje de Halloween vuela montada en una escoba?","correct":["Bruja"],"incorrect":["Zombi","Momia","Hombre lobo"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Qué animal con alas vuela de noche y se asocia con los vampiros?","correct":["Murciélago"],"incorrect":["Búho","Águila","Paloma"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Cómo se llama el monstruo envuelto en vendas de Egipto?","correct":["Momia"],"incorrect":["Fantasma","Esqueleto","Vampiro"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Qué ser mágico y diminuto puede jugarte una mala pasada?","correct":["Duende"],"incorrect":["Dragón","Ogro","Gigante"],"readingTime":3,"speed":"normal"},
 {"prompt":"¿Qué pueblo antiguo creía que los espíritus caminaban entre los vivos?","correct":["Los celtas"],"incorrect":["Los romanos","Los vikingos","Los egipcios"],"readingTime":3,"speed":"normal"}
]}]}]};
let DB;try{DB=JSON.parse(localStorage.getItem('repasoDB_halloween'))}catch(e){}
const valid=d=>d&&Array.isArray(d.subjects)&&d.subjects.every(s=>s.name&&Array.isArray(s.topics));
const norm=d=>{d.subjects.forEach(s=>s.topics.forEach(x=>{if(x.levels){x.questions=(x.questions||[]).concat(...x.levels.map(l=>l.questions||[]));delete x.levels}x.questions=x.questions||[]}));return d};
if(!valid(DB))DB=JSON.parse(JSON.stringify(DEF));norm(DB);
const save=()=>{try{localStorage.setItem('repasoDB_halloween',JSON.stringify(DB))}catch(e){}};
/* Si el navegador ya tenía temario guardado: quita las preguntas de ejemplo y añade las nuevas (solo una vez por versión; no borra las tuyas) */
const VER='v2',OLD=['Suma o resta que dé 6','Operación que dé 10','Resultado igual a 12','Palabra bien escrita','Se escribe con B','Translate: Cat','Translate: Dog','Colour: rojo'];
try{if(localStorage.getItem('repasoVer')!=VER){
 DB.subjects.forEach(s=>s.topics.forEach(t=>t.questions=t.questions.filter(q=>!OLD.includes(q.prompt))));
 DEF.subjects.forEach(ds=>{let s=DB.subjects.find(x=>x.name==ds.name);if(!s)DB.subjects.push(s={name:ds.name,topics:[]});
  ds.topics.forEach(dt=>{let t=s.topics.find(x=>x.name==dt.name);if(!t)s.topics.push(t={name:dt.name,questions:[]});
   dt.questions.forEach(q=>{if(!t.questions.some(y=>y.prompt==q.prompt&&JSON.stringify(y.correct)==JSON.stringify(q.correct)))t.questions.push(JSON.parse(JSON.stringify(q)))})})});
 DB.subjects.forEach(s=>s.topics=s.topics.filter(t=>t.questions.length||isTab(s,t)));DB.subjects=DB.subjects.filter(s=>s.topics.length);
 save();localStorage.setItem('repasoVer',VER)}}catch(e){}
/* ===== TABLAS DE MULTIPLICAR (preguntas generadas según las tablas elegidas) ===== */
function isTab(s,t){return s&&t&&s.name=='Matemáticas'&&t.name=='Tablas de multiplicar'}
let TSEL;try{TSEL=JSON.parse(localStorage.getItem('tablasSel'))}catch(e){}
if(!Array.isArray(TSEL))TSEL=Array.from({length:13},(_,i)=>i);
const saveT=()=>{try{localStorage.setItem('tablasSel',JSON.stringify(TSEL))}catch(e){}};
function tabQs(){const out=[];TSEL.forEach(t=>{for(let n=0;n<=12;n++){const r=t*n,c=new Set([t*(n+1),n>0?t*(n-1):-1,r+t,r-t,r+1,r-1,r+2,r-2,r+10,r-10,t+n,n,t,(t+1)*n,(t-1)*n].filter(v=>v>=0&&v!=r&&v<=200));
 let k=1;while(c.size<4){if(k!=r)c.add(k);k++}
 const inc=[...c].sort(()=>Math.random()-.5).slice(0,4).map(String);
 out.push({prompt:'¿Cuánto es '+t+' × '+n+'?',correct:[String(r)],incorrect:inc,readingTime:3,speed:'normal'})}});return out}
function tabUI(){const s=DB.subjects[$('#sSub').value],t=s&&s.topics[$('#sTop').value],on=isTab(s,t);$('#tabs').hidden=!on;
 if(on)$('#tg').innerHTML=Array.from({length:13},(_,i)=>`<button type="button" class="chip${TSEL.includes(i)?' on':''}" data-t="${i}" aria-pressed="${TSEL.includes(i)}">${i}</button>`).join('')}
$('#tg').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const i=+b.dataset.t;TSEL=TSEL.includes(i)?TSEL.filter(x=>x!=i):TSEL.concat(i).sort((a,b)=>a-b);saveT();tabUI()};
$('#tAll').onclick=()=>{TSEL=Array.from({length:13},(_,i)=>i);saveT();tabUI()};
$('#tNone').onclick=()=>{TSEL=[];saveT();tabUI()};
/* ===== MENÚ ===== */
const show=id=>['menu','game','over','ed'].forEach(x=>$('#'+x).hidden=x!=id);
function fill(sel,arr,extra){const v=sel.value;sel.innerHTML=arr.map((o,i)=>`<option value="${i}">${esc(o.name)}</option>`).join('')+(extra?'<option value="new">➕ Nueva…</option>':'');if([...sel.options].some(o=>o.value==v))sel.value=v}
function refresh(){fill($('#sSub'),DB.subjects);const s=DB.subjects[$('#sSub').value];fill($('#sTop'),s?s.topics:[]);tabUI()}
$('#sTop').onchange=tabUI;
$('#sSub').onchange=()=>{$('#sTop').innerHTML='';refresh()};
function cur(){try{const s=DB.subjects[$('#sSub').value];if(isTab(s,s.topics[$('#sTop').value]))return tabQs();return DB.subjects[$('#sSub').value].topics[$('#sTop').value].questions.filter(q=>q.prompt&&q.correct&&q.correct.length)}catch(e){return[]}}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(+b.dataset.m));
/* ===== EDITOR ===== */
const say=t=>$('#msg').textContent=t,dump=()=>$('#json').value=JSON.stringify(DB,null,1);
const eS=()=>DB.subjects[$('#eSub').value],eT=()=>{const s=eS();return s&&s.topics[$('#eTop').value]};
function efill(){fill($('#eSub'),DB.subjects,1);$('#nSub').hidden=$('#eSub').value!='new';const s=eS();fill($('#eTop'),s?s.topics:[],1);$('#nTop').hidden=$('#eTop').value!='new';const t=eT();$('#lstT').hidden=!t;
 $('#lst').innerHTML=t?t.questions.map((q,i)=>`<div class="qi"><span>${esc(q.prompt)} → <b>${esc(q.correct[0])}</b></span><button class="mini del" data-i="${i}">🗑</button></div>`).join(''):''}
$('#eSub').onchange=()=>{$('#eTop').innerHTML='';efill()};$('#eTop').onchange=efill;
$('#lst').onclick=e=>{const i=e.target.dataset.i;if(i!=null&&confirm('¿Borrar esta pregunta?')){eT().questions.splice(i,1);save();efill()}};
$('#bEd').onclick=()=>{efill();dump();say('');show('ed')};$('#bBack').onclick=()=>{refresh();show('menu')};
function imp(txt){try{const d=JSON.parse(txt);if(!valid(d))throw 0;DB=norm(d);save();refresh();efill();dump();say('Temario cargado ✔')}catch(e){say('Archivo no válido ✖')}}
$('#bImp').onclick=()=>imp($('#json').value);
$('#bExp').onclick=()=>{dump();const t=$('#json').value;$('#json').select();try{navigator.clipboard.writeText(t)}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='temario.json';a.click()}catch(e){}
 say('Copiado. Si no se descarga, pégalo en un archivo .json')};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)};
$('#bAdd').onclick=()=>{const f=n=>$(n).value.trim(),inc=[...document.querySelectorAll('.aI')].map(i=>i.value.trim()),p=f('#aP'),c=f('#aC');
 const sn=$('#eSub').value=='new'?f('#nSub'):eS().name,tn=$('#eTop').value=='new'?f('#nTop'):eT().name;
 if(!sn||!tn)return say('Elige o escribe la asignatura y el tema');
 if(!p||!c||inc.some(x=>!x))return say('Rellena la pregunta, la correcta y las 3 respuestas malas');
 const g=(a,n,o)=>a.find(x=>x.name==n)||(a.push(o),o);
 const s=g(DB.subjects,sn,{name:sn,topics:[]}),t=g(s.topics,tn,{name:tn,questions:[]});
 t.questions.push({prompt:p,correct:[c],incorrect:inc,readingTime:3});save();refresh();
 ['#aP','#aC','#nSub','#nTop'].forEach(i=>$(i).value='');document.querySelectorAll('.aI').forEach(i=>i.value='');
 $('#eSub').value=DB.subjects.indexOf(s);$('#eTop').innerHTML='';efill();$('#eTop').value=s.topics.indexOf(t);efill();say('✔ Pregunta añadida a '+sn+' › '+tn)};
/* ===== AUDIO (Web Audio sintetizado) ===== */
let AC;function snd(f,d=.12,ty='square',f2){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}

/* ===== JUEGO ===== */
const cv=$('#cv'),X=cv.getContext('2d'),W=640,H=400,GY=H-70;let G=null,keys={};
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),pick=a=>a[Math.floor(Math.random()*a.length)];
const HINTS=['','← → o arrastra: mueve la cesta y atrapa la caja correcta','← → o toca izquierda/centro/derecha: cambia de carril. Coge las correctas, esquiva las demás','↑/Espacio: saltar · ↓: agacharse (táctil: toca arriba / abajo). Suelo: salta para esquivar · Aire: agáchate para esquivar'];
function start(m){const qs=cur();if(!qs.length)return alert(!$('#tabs').hidden?'Elige al menos una tabla de multiplicar':'Este nivel no tiene preguntas');snd(440,.05);
 G={mode:m,lvl:+$('#sLvl').value,order:sh(qs),r:0,lives:3,score:0,combo:0,maxC:0,ok:0,bad:0,jh:0,vy:0,px:W/2,lane:1,bg:0,pause:0,over:0};
 $('#hint').textContent=HINTS[m];show('game');newRound()}
function newRound(){const q=G.q=G.order[G.r%G.order.length],s=(q.speed||'n')[0];G.sm=s=='l'?.45:s=='r'?.9:.65;G.rt=Math.max(0,Math.min(5,+q.readingTime||0));G.t=G.rt;G.st='read';G.items=[];G.spawned=0;G.sp=0;G.rd=0;
 const inc=q.incorrect||[],okf=()=>pick(q.correct),bd=()=>inc.length?pick(inc):'✗';X.font='bold 22px system-ui';
 if(G.mode==1){const w=sh([...new Set(inc)]);while(w.length<3)w.push(bd());G.items=sh([{t:okf(),ok:1},...w.slice(0,3).map(t=>({t,ok:0}))]);G.items.forEach((it,i)=>{it.w=Math.min(154,X.measureText(it.t).width+30);it.x=W/8+i*W/4;it.y=105})}
 else{const n=G.mode==2?7:5;G.plan=sh(Array.from({length:n},(_,i)=>i<2||Math.random()<.35)).map(f=>({ok:f,t:f?okf():bd(),hi:Math.random()<.5}))}}
function res(ok){if(ok){G.combo++;G.maxC=Math.max(G.maxC,G.combo);G.score+=100*G.lvl;G.ok++;SFX.ok();G.fl=[.25,'#2ecc71']}else{G.lives--;G.combo=0;G.bad++;SFX.bad();G.fl=[.25,'#e74c3c'];if(G.lives<=0)finish(0)}}
function endRound(){G.r++;G.items=[];if(G.r>=10)return finish(1);G.st='wait';G.pause=.9}
function finish(w){if(G.over)return;G.over=1;SFX.over();setTimeout(()=>{if(!G)return;$('#oT').textContent=w?'🏆 ¡Lo has conseguido!':'💥 Game Over';
 $('#oS').innerHTML=`✅ Aciertos: <b>${G.ok}</b> &nbsp; ❌ Fallos: <b>${G.bad}</b><br>PTOS: <b>${G.score}</b><br>Rondas: ${Math.min(G.r+(w?0:1),10)}/10`;show('over')},900)}
function upd(dt){if(G.fl)G.fl[0]-=dt;
 if(G.pause>0){G.pause-=dt;if(G.pause<=0)newRound();return}
 const m=G.mode,sm=G.sm;
 if(m==1){const v=380*dt;if(keys.ArrowLeft)G.px-=v;if(keys.ArrowRight)G.px+=v;G.px=Math.max(45,Math.min(W-45,G.px))}
 if(m==3){G.duck=keys.ArrowDown&&G.jh==0?1:0;if(G.jh>0||G.vy>0){G.vy-=1500*dt;G.jh+=G.vy*dt;if(G.jh<=0){G.jh=0;G.vy=0}}}
 if(G.st=='read'){G.t-=dt;if(G.t<=0)G.st='play';return}
 if(G.st!='play')return;
 if(m==2)G.bg=(G.bg+dt*140*sm)%40;
 if(m>1){G.sp-=dt;if(G.sp<=0&&G.spawned<G.plan.length){const p=G.plan[G.spawned++];X.font='bold 22px system-ui';const it={t:p.t,ok:p.ok,hi:p.hi,w:Math.min(m==2?134:220,X.measureText(p.t).width+30)};if(m==2){it.l=Math.floor(Math.random()*3);it.y=90}else it.x=W+60;G.items.push(it);G.sp=(m==2?1.1:1.8)/sm}}
 for(const it of G.items){
  if(m==1){it.y+=[0,38,58,80][G.lvl]*dt;if(it.y+20>=H-82&&Math.abs(it.x-G.px)<it.w/2+14){it.d=1;res(it.ok);G.rd=1}else if(it.y>H-24){it.d=1;if(it.ok){res(0);G.rd=1}}}
  if(m==2){it.y+=140*sm*dt;if(it.l==G.lane&&it.y>H-95&&it.y<H-25){it.d=1;res(it.ok)}else if(it.y>H+20){it.d=1;if(it.ok)G.combo=0}}
  if(m==3){it.x-=210*sm*dt;const pt=GY-G.jh-(G.duck?28:52),pb=GY-G.jh,t0=it.hi?GY-80:GY-40,t1=it.hi?GY-40:GY;if(Math.abs(it.x-100)<it.w/2+24&&t0<pb&&t1>pt){it.d=1;res(it.ok)}else if(it.x<-100){it.d=1;if(it.ok)G.combo=0}}
  if(G.over)return}
 G.items=G.items.filter(i=>!i.d);
 if(G.rd||(m>1&&G.spawned>=G.plan.length&&!G.items.length)){G.rd=0;endRound()}}
/* ===== DIBUJO ===== */
function rr(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}
function tx(s,x,y,sz,c='#fff',al='center'){X.font='bold '+sz+'px system-ui,sans-serif';X.textAlign=al;X.fillStyle=c;X.fillText(s,x,y)}
function box(it,x,y){rr(x-it.w/2,y-20,it.w,40,10,'#ffd23f');X.strokeStyle='#333';X.lineWidth=2;X.stroke();X.textBaseline='middle';tx(it.t,x,y+1,22,'#222');X.textBaseline='alphabetic'}
function draw(){X.setTransform(2,0,0,2,0,0);const m=G.mode,cx=W/2+(G.lane-1)*140;
 if(m==1&&BGI.naturalWidth)X.drawImage(BGI,0,0,W,H);else if(m!=2){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5cc8ff');g.addColorStop(1,'#d8f3ff');X.fillStyle=g;X.fillRect(0,0,W,H)}

 if(m==2){X.fillStyle='#3a9d3a';X.fillRect(0,0,W,H);X.fillStyle='#444';X.fillRect(W/2-210,0,420,H);X.fillStyle='#fff';for(let i=-1;i<11;i++)[-70,70].forEach(d=>X.fillRect(W/2+d-3,i*40+G.bg,6,22))}
 if(m==3){X.fillStyle='#6b4a2b';X.fillRect(0,GY,W,H-GY);X.fillStyle='#5cb85c';X.fillRect(0,GY,W,8)}
 if(G.st=='play')for(const it of G.items){if(m==1)box(it,it.x,it.y);if(m==2)box(it,W/2+(it.l-1)*140,it.y);if(m==3)box(it,it.x,it.hi?GY-60:GY-20)}
 if(m==1&&MI.naturalWidth){const h=84,w=h*MI.naturalWidth/MI.naturalHeight;X.drawImage(MI,G.px-w/2,H-h-4,w,h)}
 if(m==2){rr(cx-18,H-85,36,64,8,'#e22');rr(cx-12,H-72,24,16,4,'#9cf');rr(cx-12,H-48,24,10,3,'#322');[[-22,-80],[16,-80],[-22,-45],[16,-45]].forEach(p=>rr(cx+p[0],H+p[1],6,16,2,'#111'));X.font='34px serif';X.textAlign='center';X.fillText('🥷',cx,H-40)}
 if(m==3){X.font=(G.duck?32:56)+'px serif';X.textAlign='center';X.fillText('🥷',100,GY-G.jh+2)}
 X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,50);tx(G.q.prompt,W/2,33,G.q.prompt.length>38?16:24);
 X.fillStyle='rgba(0,0,0,.45)';X.fillRect(0,50,W,28);tx('❤️'.repeat(Math.max(0,G.lives)),10,71,18,'#fff','left');tx('PTOS: '+G.score,W/2,71,18);tx('Nivel '+G.lvl+' · Ronda '+Math.min(G.r+1,10)+'/10',W-10,71,16,'#fff','right');
 if(G.st=='read'&&G.rt>0){rr(W/2-150,H/2-40,300,70,16,'rgba(0,0,0,.6)');tx('📖 Piensa… '+Math.ceil(G.t),W/2,H/2+8,32)}
 if(G.fl&&G.fl[0]>0){X.globalAlpha=G.fl[0];X.fillStyle=G.fl[1];X.fillRect(0,0,W,H);X.globalAlpha=1}}
/* ===== CONTROLES ===== */
function jump(){if(G&&G.mode==3&&G.jh==0&&G.st!='wait'&&!G.over){G.vy=600;G.jh=.1;SFX.jump()}}
addEventListener('keydown',e=>{if(!G||G.over||$('#game').hidden)return;const k=e.key==' '?' ':e.key;keys[k]=1;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
 if(G.mode==2){if(k=='ArrowLeft')G.lane=Math.max(0,G.lane-1);if(k=='ArrowRight')G.lane=Math.min(2,G.lane+1)}
 if(k=='ArrowUp'||k==' ')jump()});
addEventListener('keyup',e=>keys[e.key=='' ?' ':e.key]=0);
function ptr(e,d){if(!G||G.over)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(G.mode==1)G.px=Math.max(45,Math.min(W-45,x));
 if(G.mode==2&&(d||e.buttons))G.lane=Math.min(2,Math.max(0,Math.floor(x/W*3)));
 if(G.mode==3&&d){if(y<H/2)jump();else keys.ArrowDown=1}}
cv.addEventListener('pointerdown',e=>ptr(e,1));cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType=='mouse')ptr(e,0)});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>keys.ArrowDown=0));
[['#bL','ArrowLeft'],['#bR','ArrowRight']].forEach(([id,k])=>{const b=$(id),on=e=>{e.preventDefault();if(!G||G.over)return;keys[k]=1;b.classList.add('on');if(G.mode==2)G.lane=Math.max(0,Math.min(2,G.lane+(k=='ArrowLeft'?-1:1)))},off=()=>{keys[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));b.addEventListener('contextmenu',e=>e.preventDefault())});
$('#bExit').onclick=()=>{G=null;show('menu')};$('#bMenu').onclick=()=>{G=null;show('menu')};$('#bAgain').onclick=()=>start(G.mode);
let last=0;function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;if(G){if(!G.over)upd(dt);if(G)draw()}requestAnimationFrame(loop)}
refresh();requestAnimationFrame(n=>{last=n;loop(n)});
</script></body></html>
